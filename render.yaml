services:
  - type: web
    name: trustlens-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python -c \"import easyocr; easyocr.Reader(['en','hi'], gpu=False)\""
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: trustlens_db
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
    healthCheckPath: /health
    autoDeploy: true
    plan: starter
